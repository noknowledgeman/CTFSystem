name: "Picture verify"
description: "The flag is in a picture at /flag.png"
flag: "CTF{READ_THE_IMAGE}"
difficulty: "easy"
deployment:
  remote_dir: "/root/sample5"
services:
  - name: "web"
    protocol: "http"
    host: "127.0.0.1"
    port: 8000
    path: "/"
    expected_status: 200
validation_steps:
  - type: "manual_review"
    instructions: "the flag is in an image at http://localhost:8000/flag.png"
    evidence_hint: "Its self explanatory"
  - type: "container_running"
  - type: "service_check"
    service: "web"